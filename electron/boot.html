<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>面试资料伴侣</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .boot { width: calc(100% - 12px); height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; background: rgba(43,45,49,.92); color: #d8d8d8; font-size: 13px; }
      .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #b9f85a; box-shadow: 0 0 12px rgba(185,248,90,.7); }
    </style>
  </head>
  <body>
    <div class="boot"><span class="dot"></span><span>正在准备本地资料…</span></div>
  </body>
</html>
